version: '3.8'

services:
  # ===========================================
  # Kafka Broker (KRaft mode - no Zookeeper)
  # ===========================================
  broker:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    hostname: broker
    container_name: broker
    user: root
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-1}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_BROKER_ID:-1}@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - streaming-network

  # ===========================================
  # PostgreSQL - Conduktor metadata storage
  # ===========================================
  postgresql:
    image: postgres:${POSTGRES_VERSION:-14}
    hostname: postgresql
    container_name: postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      PGDATA: "/var/lib/postgresql/data"
      POSTGRES_DB: ${CONDUKTOR_DB_NAME:-conduktor-console}
      POSTGRES_USER: ${CONDUKTOR_DB_USER:-conduktor}
      POSTGRES_PASSWORD: ${CONDUKTOR_DB_PASSWORD:-conduktor_password}
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONDUKTOR_DB_USER:-conduktor} -d ${CONDUKTOR_DB_NAME:-conduktor-console}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - streaming-network

  # ===========================================
  # Conduktor Console - Kafka UI
  # ===========================================
  conduktor-console:
    image: conduktor/conduktor-console:${CONDUKTOR_VERSION:-1.41.0}
    hostname: conduktor-console
    container_name: conduktor-console
    ports:
      - "${CONDUKTOR_PORT:-8080}:8080"
    volumes:
      - conduktor_data:/var/conduktor
    environment:
      CDK_ADMIN_EMAIL: "admin@conduktor.io"
      CDK_ADMIN_PASSWORD: "adminP4ss!"
      CDK_DATABASE_URL: "postgresql://${CONDUKTOR_DB_USER:-conduktor}:${CONDUKTOR_DB_PASSWORD:-conduktor_password}@postgresql:5432/${CONDUKTOR_DB_NAME:-conduktor-console}"
      CDK_ORGANIZATION_NAME: ${CONDUKTOR_ORG_NAME:-streaming-demo}
      # Kafka cluster configuration
      CDK_CLUSTERS_0_ID: "local-kafka"
      CDK_CLUSTERS_0_NAME: "local-kafka"
      CDK_CLUSTERS_0_BOOTSTRAPSERVERS: "broker:29092"
      CDK_CLUSTERS_0_COLOR: "#6A57C8"
      CDK_CLUSTERS_0_ICON: "kafka"
      # Monitoring (optional)
      CDK_MONITORING_CORTEX-URL: http://conduktor-monitoring:9009/
      CDK_MONITORING_ALERT-MANAGER-URL: http://conduktor-monitoring:9010/
      CDK_MONITORING_CALLBACK-URL: http://conduktor-console:8080/monitoring/api/
      CDK_MONITORING_NOTIFICATIONS-CALLBACK-URL: http://localhost:${CONDUKTOR_PORT:-8080}
    depends_on:
      broker:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    networks:
      - streaming-network

  # ===========================================
  # Conduktor Monitoring (Optional)
  # ===========================================
  conduktor-monitoring:
    image: conduktor/conduktor-console-cortex:${CONDUKTOR_VERSION:-1.41.0}
    hostname: conduktor-monitoring
    container_name: conduktor-monitoring
    environment:
      CDK_CONSOLE-URL: "http://conduktor-console:8080"
    depends_on:
      - conduktor-console
    networks:
      - streaming-network

  # ===========================================
  # Apache Flink JobManager
  # ===========================================
  flink-jobmanager:
    image: flink:${FLINK_VERSION:-1.20}
    hostname: flink-jobmanager
    container_name: flink-jobmanager
    ports:
      - "${FLINK_JOBMANAGER_PORT:-8081}:8081"
    command: jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        parallelism.default: 2
    volumes:
      - flink_data:/opt/flink/data
    networks:
      - streaming-network

  # ===========================================
  # Apache Flink TaskManager
  # ===========================================
  flink-taskmanager:
    image: flink:${FLINK_VERSION:-1.20}
    hostname: flink-taskmanager
    container_name: flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        parallelism.default: 2
    volumes:
      - flink_data:/opt/flink/data
    networks:
      - streaming-network

networks:
  streaming-network:
    driver: bridge

volumes:
  kafka_data:
  pg_data:
  conduktor_data:
  flink_data:

